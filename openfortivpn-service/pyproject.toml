[project]
name = "openfortivpn-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openfortivpn-common>=0.1.0",
]

[project.scripts]
openfortivpn-service = "openfortivpn_service.cli:main"
nm-openfortivpn-auth-dialog = "openfortivpn_service.auth_dialog:main"

[project.entry-points."nm-vpn-plugin"]
openfortivpn = "openfortivpn_service.nm.plugin:OpenFortivpnPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openfortivpn_service"]
