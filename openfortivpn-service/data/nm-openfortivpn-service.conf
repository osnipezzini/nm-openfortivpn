<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE policyconfig PUBLIC
 "-//freedesktop//DTD PolicyKit Policy Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/PolicyKit/1.0/policyconfig.dtd">
<policyconfig>
  <vendor>openfortivpn-nm</vendor>
  <vendor_url>https://github.com/adrienverge/openfortivpn</vendor_url>
  <action id="org.freedesktop.NetworkManager.openfortivpn">
    <description>Configure openfortivpn VPN connections</description>
    <message>Authentication is required to configure openfortivpn VPN connections</message>
    <defaults>
      <allow_any>no</allow_any>
      <allow_inactive>no</allow_inactive>
      <allow_active>auth_admin_keep</allow_active>
    </defaults>
    <annotate key="org.freedesktop.policykit.exec.path">/usr/bin/openfortivpn-nm</annotate>
  </action>
</policyconfig>
